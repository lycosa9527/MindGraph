<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>演讲模式 LVGL face — 360 preview</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Noto Sans CJK SC", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #0b0c10;
      color: #f2f2f2;
      padding: 24px;
    }
    h1 { font-size: 20px; font-weight: 600; margin: 0 0 8px; }
    p { color: #9aa0a8; margin: 0 0 16px; max-width: 780px; line-height: 1.45; }
    .row { display: flex; flex-wrap: wrap; gap: 28px; align-items: flex-start; }
    .watch {
      width: 360px;
      height: 360px;
      border-radius: 50%;
      background: #E2E8F0;
      color: #fff;
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 0 10px #1a1a1a;
    }
    .title {
      position: absolute; left: 100px; top: 16px; width: 160px; height: 22px;
      text-align: center; font-size: 15px; font-weight: 600; line-height: 22px;
      color: #0F172A;
    }
    .status {
      position: absolute; left: 64px; top: 42px; width: 232px; height: 24px;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      font-size: 13px; line-height: 24px; font-weight: 600;
    }
    .dot {
      width: 8px; height: 8px; border-radius: 50%; flex: 0 0 8px;
    }
    .dot.green { background: #22C55E; }
    .dot.orange { background: #F59E0B; }
    .status.good { color: #15803D; }
    .status.wait { color: #C2410C; }
    .piece {
      position: absolute; display: flex; align-items: center; justify-content: center;
      font-size: 15px; font-weight: 700; color: #fff;
      border: 2px solid #F8FAFC;
    }
    .prev { left: 30px; top: 146px; width: 150px; height: 52px; background: #0284C7; }
    .next { left: 180px; top: 146px; width: 150px; height: 52px; background: #059669; }
    .auto { left: 30px; top: 198px; width: 300px; height: 52px; background: #F59E0B; }
    .pill {
      position: absolute; display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 700; color: #fff;
      border: 2px solid #F8FAFC; border-radius: 22px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 10px;
    }
    .drop { left: 54px; top: 260px; width: 136px; height: 44px; background: #475569; }
    .host { left: 206px; top: 260px; width: 100px; height: 44px; background: #DC2626; }
    .host.start { background: #16A34A; }
    .seg {
      position: absolute; left: 60px; top: 84px; width: 240px; height: 52px;
      border-radius: 26px; background: #CBD5E1; overflow: hidden;
    }
    .seg-thumb {
      position: absolute; top: 4px; left: 4px; width: 116px; height: 44px;
      border-radius: 22px; background: #fff;
      transition: left 0.18s ease;
    }
    .seg.deep .seg-thumb { left: 120px; }
    .seg-hit {
      position: absolute; top: 0; width: 120px; height: 52px;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 700; color: #64748B; cursor: pointer;
      user-select: none;
    }
    .seg-hit.first { left: 0; }
    .seg-hit.second { left: 120px; }
    .seg:not(.deep) .seg-hit.first,
    .seg.deep .seg-hit.second { color: #0F172A; }
    .dim .seg,
    .dim .piece { opacity: 0.7; }
    .host.dim { opacity: 0.7; }
    .picker {
      position: absolute; left: 44px; top: 72px; width: 272px; height: 176px;
      border-radius: 16px; background: #FFFFFF; border: 1px solid #E2E8F0;
      padding: 10px 8px; color: #0F172A;
    }
    .picker-row {
      height: 36px; border-radius: 10px; background: #F1F5F9;
      margin-bottom: 6px; padding: 0 10px; font-size: 13px; font-weight: 600;
      line-height: 36px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    code { color: #d8d8d8; }
  </style>
</head>
<body>
  <h1>演讲模式 remote preview (not Super WASM)</h1>
  <p>
    Pixel layout from <code>slides_ui_face.cpp</code>.
    一级分支 / 深度遍历 is a sliding pill (white thumb). Tap it on the first face.
    Then 上一页 | 下一页, 自动轮播. Bottom row is Kitty-style 图库 plus green 开始 / red 退出.
  </p>
  <div class="row">
    <figure>
      <div class="watch" id="live">
        <div class="title">演讲模式</div>
        <div class="status good"><span class="dot green"></span>3 / 12</div>
        <div class="seg" id="live-seg">
          <div class="seg-thumb"></div>
          <div class="seg-hit first" data-deep="0">一级分支</div>
          <div class="seg-hit second" data-deep="1">深度遍历</div>
        </div>
        <div class="piece prev">上一页</div>
        <div class="piece next">下一页</div>
        <div class="piece auto">自动轮播</div>
        <div class="pill drop">产品规划 · 思维导图</div>
        <div class="pill host">退出</div>
      </div>
    </figure>
    <figure>
      <div class="watch">
        <div class="title">演讲模式</div>
        <div class="status good"><span class="dot green"></span>3 / 12</div>
        <div class="seg deep">
          <div class="seg-thumb"></div>
          <div class="seg-hit first">一级分支</div>
          <div class="seg-hit second">深度遍历</div>
        </div>
        <div class="piece prev">上一页</div>
        <div class="piece next">下一页</div>
        <div class="piece auto">自动轮播</div>
        <div class="pill drop">产品规划 · 思维导图</div>
        <div class="pill host">退出</div>
      </div>
    </figure>
    <figure>
      <div class="watch dim">
        <div class="title">演讲模式</div>
        <div class="status wait"><span class="dot orange"></span>请选图库</div>
        <div class="seg">
          <div class="seg-thumb"></div>
          <div class="seg-hit first">一级分支</div>
          <div class="seg-hit second">深度遍历</div>
        </div>
        <div class="piece prev">上一页</div>
        <div class="piece next">下一页</div>
        <div class="piece auto">自动轮播</div>
        <div class="pill drop">图库</div>
        <div class="pill host start dim">开始</div>
      </div>
    </figure>
    <figure>
      <div class="watch dim">
        <div class="title">演讲模式</div>
        <div class="status wait"><span class="dot orange"></span>点开始放映</div>
        <div class="seg">
          <div class="seg-thumb"></div>
          <div class="seg-hit first">一级分支</div>
          <div class="seg-hit second">深度遍历</div>
        </div>
        <div class="piece prev">上一页</div>
        <div class="piece next">下一页</div>
        <div class="piece auto">自动轮播</div>
        <div class="pill drop">产品规划 · 思维导图</div>
        <div class="pill host start">开始</div>
      </div>
    </figure>
    <figure>
      <div class="watch">
        <div class="title">演讲模式</div>
        <div class="status wait"><span class="dot orange"></span>请选图库</div>
        <div class="seg">
          <div class="seg-thumb"></div>
          <div class="seg-hit first">一级分支</div>
          <div class="seg-hit second">深度遍历</div>
        </div>
        <div class="piece prev">上一页</div>
        <div class="piece next">下一页</div>
        <div class="piece auto">自动轮播</div>
        <div class="pill drop">图库</div>
        <div class="pill host start dim">开始</div>
        <div class="picker">
          <div class="picker-row">产品规划 · 思维导图</div>
          <div class="picker-row">双气泡图教程 · 双气泡图</div>
          <div class="picker-row">未命名 · 圆圈图</div>
        </div>
      </div>
    </figure>
  </div>
  <script>
    const seg = document.getElementById("live-seg");
    seg.querySelectorAll(".seg-hit").forEach((hit) => {
      hit.addEventListener("click", () => {
        seg.classList.toggle("deep", hit.dataset.deep === "1");
      });
    });
  </script>
</body>
</html>
