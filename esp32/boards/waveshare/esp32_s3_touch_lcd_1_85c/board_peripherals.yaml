# V1 factory demo pins (ESP32-S3-Touch-LCD-1.85C-Test).
# GPIO10/11 are onboard I2C (touch, TCA9554, RTC). The V1-vs-V2 "NC" row is
# audio/header remapping, not the touch bus.
peripherals:
  - name: i2c_master
    type: i2c
    role: master
    config:
      port: 0
      pins:
        sda: 11
        scl: 10

  - name: spi_display
    type: spi
    role: master
    config:
      spi_bus_config:
        spi_port: SPI2_HOST
        sclk_io_num: 40
        mosi_io_num: 46
        miso_io_num: 45
        quadwp_io_num: 42
        quadhd_io_num: 41
        max_transfer_sz: 7200

  # Any GPIO peripheral is enough for board-manager to emit periph_gpio_* types.
  # Do not name this gpio_backlight_control: the HAL then expects a handle.
  - name: gpio_type_stub
    type: gpio
    role: io
    config:
      pin: 18
      mode: GPIO_MODE_INPUT
      default_level: 0

  - name: ledc_backlight
    type: ledc
    role: none
    config:
      gpio_num: 5
      freq_hz: 5000
      duty: 4000
      duty_resolution: LEDC_TIMER_13_BIT

  # PCM5101 + NS8002 speaker path (factory Test). No MCLK; attach a speaker to the pads.
  - name: i2s_audio_out
    type: i2s
    role: master
    format: std-out
    config:
      port: 0
      sample_rate_hz: 22050
      mclk_multiple: 256
      data_bit_width: 16
      slot_bit_width: I2S_SLOT_BIT_WIDTH_AUTO
      slot_mode: I2S_SLOT_MODE_STEREO
      slot_mask: I2S_STD_SLOT_BOTH
      ws_width: 16
      pins:
        mclk: -1
        bclk: 48
        ws: 38
        dout: 47
        din: -1

  # Onboard MEMS I2S mic (V1). 24-bit left-justified in 32-bit Philips slots.
  # 16-bit mono LEFT captured the LSBs (near silence) so Fun-ASR returned empty.
  - name: i2s_audio_in
    type: i2s
    role: master
    format: std-in
    config:
      port: 1
      sample_rate_hz: 16000
      mclk_multiple: 256
      data_bit_width: 32
      slot_bit_width: I2S_SLOT_BIT_WIDTH_32BIT
      slot_mode: I2S_SLOT_MODE_STEREO
      slot_mask: I2S_STD_SLOT_BOTH
      ws_width: 32
      pins:
        mclk: -1
        bclk: 15
        ws: 2
        dout: -1
        din: 39
